/**
 * UI-free core module: configuration model, legacy properties IO, new YAML (.ifcx) IO.
 */

plugins {
    id 'eclipse'
}

eclipse {
    project {
        name = 'autumo-ifacex-studio-fx-core'
    }
}

dependencies {
    api 'org.snakeyaml:snakeyaml-engine:2.9'
    
    // The framework's own JavaFX is excluded; the Studio pins its own JavaFX 25 (above).
    api("ch.autumo.commons:autumo-ui:${autumoUiVersion}") {
        exclude group: 'org.openjfx'
    }
}

test.testLogging { 
    showStandardStreams = true
}

/**
 * Converts legacy configurations into the new .ifcx format, with the classpath and the compiled
 * classes of this build - no IDE state involved.
 *
 * <pre>
 *   ./gradlew :core:convert --args="<in.ifacex|in.cfg|in.template|dir> [outDir]"
 *   ./gradlew :core:convert --args="--check <dir>"
 * </pre>
 */
tasks.register('convert', JavaExec) {
    group = 'ifacex'
    description = 'Convert legacy .ifacex/.cfg/.template to .ifcx (ConvertTool)'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'ch.autumo.ifacex.studio.core.ConvertTool'
}
