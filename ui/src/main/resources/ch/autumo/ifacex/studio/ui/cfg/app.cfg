# ifaceX Studio FX - application template configuration (autumo-ui)
# Application configuration template shipped with the Studio. Keys are read by BaseApp /
# ConfigurationManager; unset keys fall back to the defaults below. Values may be
# overridden on the command line with -D<key>=<value>. The user's own copy lives in
# ~/Library/Application Support/autumo/ifaceXStudioFX/cfg/app.cfg and is never overwritten
# by the bundled template.

# --- URLs ---------------------------------------------------------------------
url.purchase=https://products.autumo.ch
url.website=https://products.autumo.ch
url.documentation=https://products.autumo.ch
url.website.updates=https://products.autumo.ch
url.website.version.file=https://products.autumo.ch/xml/template.xml

# --- Contact ------------------------------------------------------------------
email.sales=info@autumo.ch
email.support=info@autumo.ch

# --- UI / window -------------------------------------------------------------
# Detach the menu bar to the macOS system menu bar (yes/no).
disableMacOSMenuDetach=yes
primaryStageStyle=DECORATED

# --- Networking --------------------------------------------------------------
https.protocols=TLSv1.2
jdk.tls.client.protocols=TLSv1.2

# --- Language ----------------------------------------------------------------
# Application language: 'de' or 'en'. Unset: the language of this desktop,
# 'en' when there is no catalogue for it.
# -Difacex.lang=<code> overrides this value.
#language=