/**
 * UI module: the Studio shell on the autumo-ui framework.
 *
 * - badass-runtime: jlink runtime image + jpackage installer (the Studio's own
 *   application icon is the autumo-ifacex-studio set in src/main/resources/.../icons/).
 * - shadow: a standalone fat jar (one JAR instead of many — an advantage on Windows).
 * - openjfx: the Studio pins its own JavaFX 25 (the framework's JavaFX is excluded).
 */

plugins {
    id 'eclipse'
    id 'com.gradleup.shadow'
    id 'org.beryx.runtime'
    id 'org.openjfx.javafxplugin'
}

javafx {
    version = '25'
    modules = ['javafx.controls', 'javafx.fxml', 'javafx.web', 'javafx.swing', 'javafx.media']
}

eclipse {
    project {
        name = 'autumo-ifacex-studio-fx-ui'
    }
}

dependencies {
    api project(':core')
    
    implementation 'org.json:json:20260814'

    implementation 'org.apache.logging.log4j:log4j-api:2.26.1'
    implementation 'org.apache.logging.log4j:log4j-core:2.26.1'
    implementation 'org.apache.logging.log4j:log4j-slf4j2-impl:2.26.1'

    // Proprietary registration implementation (register test instances with a license
    // through the input mask). Deliberately NOT exposed by autumo-ui, so the Studio
    // declares it itself.
    implementation "ch.autumo.registration:autumo-registration:${autumoRegistrationVersion}"
}

application {
    mainClass = 'ch.autumo.ifacex.studio.ui.Launcher'
}

// JavaFX loads native libraries; on macOS this needs the native access flag.
// bin/run.sh can pass '-D...' system properties through '-PstudioJvmArgs=...'
// (e.g. -Dapp.livereload=true for the development CSS live reload).
tasks.named('run') {
    jvmArgs '--enable-native-access=javafx.graphics'
    if (project.hasProperty('studioJvmArgs')) {
        project.property('studioJvmArgs').toString().split(/\s+/).findAll { it }.each { jvmArgs it }
    }
}

// The Studio is an installed application: autumo-ui resolves the user's application data
// directory below 'user.home' (autumo-commons reads it once at class initialisation). The
// UI tests build the real shell, so they must not read or write the developer's app.cfg -
// the scratch home below the build directory isolates them completely.
tasks.named('test') {
    systemProperty 'user.home', layout.buildDirectory.dir('test-home').get().asFile
    jvmArgs '--enable-native-access=javafx.graphics'
}

// Standalone fat jar: excludes the JavaFX/JDK classes the packaged runtime provides.
shadowJar {
    exclude 'javax/**'
    exclude 'javafx/**'
    exclude 'com/sun/**'
    exclude '*.dylib'
}

def runtimeJdk = 'zulu25.36.205-ca-fx-jdk25.0.4.1'

def jdkHomeFor(String path) {
    return providers.provider {
        if (new File(path).exists()) {
            return path
        }
        return javaToolchains.launcherFor {
            languageVersion = JavaLanguageVersion.of(25)
            vendor = JvmVendorSpec.AZUL
        }.get().metadata.installationPath.asFile.absolutePath
    }
}

// WiX resources: jpackage copies only a fixed set of files into the temporary WiX config dir
// it uses as WiX base path ('light.exe -b <configDir>'). Relative license references in
// package/main.wxs ('$(var.JpRootDir)/package/...') resolve to nothing and light.exe aborts
// with LGHT0103 ('exited with 103 code'). The Windows installer therefore gets a generated
// main.wxs with absolute paths.
def wixPackageDir = file('package')
def wixResourceDir = layout.buildDirectory.dir('wix-resources')

def prepareWixResources = tasks.register('prepareWixResources') {
    def sourceWxs = new File(wixPackageDir, 'main.wxs')
    // WiX accepts forward slashes on Windows; backslashes are not escaped in XML attributes.
    def packagePath = wixPackageDir.absolutePath.replace('\\', '/')
    inputs.file(sourceWxs)
    outputs.dir(wixResourceDir)
    doLast {
        File target = wixResourceDir.get().file('main.wxs').asFile
        target.parentFile.mkdirs()
        target.text = sourceWxs.getText('UTF-8')
                .replace('$(var.JpRootDir)/package/', packagePath + '/')
    }
}

runtime {
    modules = ['javafx.controls', 'javafx.fxml', 'javafx.web', 'javafx.swing', 'javafx.media']

    // jpackage accepts one to three dot-separated integers as the application version, so the
    // development version's '-SNAPSHOT' qualifier (3.0.0-SNAPSHOT) is stripped for the installer.
    // The project version itself stays untouched.
    def installerVersion = project.version.toString().replaceFirst(/(?i)-.*$/, '')

    jpackage {
        options = [
            '--strip-debug',
            // 'zip-6' replaces the deprecated numeric '--compress 2' (JDK 21+).
            '--compress', 'zip-6',
            '--no-header-files',
            '--no-man-pages'
        ]

        // The plugin derives --app-version from project.version (3.0.0-SNAPSHOT), which jpackage
        // rejects. Override it with the sanitized, numeric installer version (see above).
        appVersion = installerVersion

        // Workflow target = Dateinamen-Fragment (macos-x64, macos-arm64, windows-x64, linux-x64).
        // Intern wird auf die beryx-targetPlatform-Namen (mac, macArch, win, linux) gemappt,
        // weil beryx targetPlatformName gegen die targetPlatform(...) Blöcke prüft.
        def workflowTarget = (project.findProperty('targetPlatform') ?: 'macos-x64').toString()
        def beryxTarget
        switch (workflowTarget) {
            case 'macos-x64':
                beryxTarget = 'mac'
                break
            case 'macos-arm64':
                beryxTarget = 'macArch'
                break
            case 'windows-x64':
                beryxTarget = 'win'
                break
            case 'linux-x64':
                beryxTarget = 'linux'
                break
            default:
                throw new GradleException("Unknown targetPlatform: ${workflowTarget}")
        }
        targetPlatformName = beryxTarget
        imageName = 'ifaceX Studio FX'
        // 'jvmArgs' intentionally not set: the former '-Djdk.gtk.version=2' is pointless since
        // JavaFX 25 dropped GTK 2 and only printed a warning about it.
        // Installer resources (Debian control file and WiX assets) live in the ui
        // module's 'package/' directory; the OS installer license stays in the root package/.
        resourceDir = file('package')

        installerOptions = [
            '--description', 'Modern JavaFX rebuild of the ifaceX Studio',
            '--copyright', 'Copyright 2026 autumo GmbH',
            '--vendor', 'autumo GmbH'
        ]

        if (targetPlatformName == 'macArch') {
            targetPlatform('macArch') {
                jdkHome = jdkHomeFor('/Volumes/Fastdrive/Development/JDKs/Azul/mac/' +
                        runtimeJdk + '-macosx_aarch64/Contents/Home')
            }
            installerType = 'pkg'
            installerOptions += ['--name', 'ifaceX-Studio-FX-arm64']
            installerOptions += ['--mac-app-category', 'Development']
        }

        if (targetPlatformName == 'mac') {
            targetPlatform('mac') {
                jdkHome = jdkHomeFor('/Volumes/Fastdrive/Development/JDKs/Azul/mac/' +
                        runtimeJdk + '-macosx_x64/Contents/Home')
            }
            installerType = 'pkg'
            installerOptions += ['--name', 'ifaceX-Studio-FX-x64']
            installerOptions += ['--mac-app-category', 'Development']
        }

        if (targetPlatformName == 'win') {
            targetPlatform('win') {
                jdkHome = jdkHomeFor('G:/Java/JDKs/Azul/' + runtimeJdk + '-win_x64')
            }
            // See prepareWixResources: WiX needs an absolute path for the license file.
            resourceDir = wixResourceDir.get().asFile
            // No installerType: the badass-runtime plugin then builds both, EXE and MSI.
            installerOptions += ['--name', 'ifaceX-Studio-FX-x64']
        }

        if (targetPlatformName == 'linux') {
            targetPlatform('linux') {
                jdkHome = jdkHomeFor('/opt/java/' + runtimeJdk + '-linux_amd64')
            }
            installerType = 'deb'
            installerOptions += ['--name', 'ifaceX-Studio-FX-x64']
            installerOptions += ['--linux-app-category', 'Development']
            installerOptions += ['--linux-deb-maintainer', 'info@autumo.ch']
            // jpackage silently derives 'Depends' from the build host when the custom control
            // file is missing, which produces a package that cannot be installed on other
            // distributions. Fail here instead of shipping such a package.
            if (!file('package/control').isFile()) {
                throw new GradleException("ui/package/control is missing. Without it jpackage derives " +
                        "the Debian 'Depends' field from the build host and the package becomes " +
                        "uninstallable on Debian/Ubuntu systems with other package names.")
            }
        }

        if (installerType == 'pkg') {
            imageOptions += ['--icon', 'src/main/resources/ch/autumo/ifacex/studio/ui/icons/autumo-ifacex-studio.icns']
            // Document types: without them macOS does not know that the Studio opens .ifcx/.ifacex
            // files, so a double-click in the Finder would not reach the application at all
            // (CFBundleDocumentTypes in Info.plist, and therefore the open-file event).
            imageOptions += ['--file-associations',
                             rootProject.file('product/packaging/file-associations/ifcx.properties').absolutePath,
                             '--file-associations',
                             rootProject.file('product/packaging/file-associations/ifacex.properties').absolutePath]
            // Bundle identifier of the application itself (Info.plist), not of the installer.
            imageOptions += ['--mac-package-identifier', 'ch.autumo.ifacex.studio.fx']
            installerOptions += [
                // Absolute path: jpackage resolves a relative --license-file against its own
                // working directory, which is not necessarily this project.
                '--license-file', file('package/LICENSE-OS-Installer.txt').absolutePath
            ]
        }

        if (targetPlatformName == 'win') {
            imageOptions += ['--icon', 'src/main/resources/ch/autumo/ifacex/studio/ui/icons/autumo-ifacex-studio.ico']
            // File associations belong to the installer, not the app-image.
            installerOptions += [
                '--file-associations',
                rootProject.file('product/packaging/file-associations/ifcx.properties').absolutePath,
                '--file-associations',
                rootProject.file('product/packaging/file-associations/ifacex.properties').absolutePath,
                '--win-dir-chooser',
                '--win-menu',
                '--win-shortcut'
            ]
        }

        if (installerType in ['deb', 'rpm']) {
            imageOptions += ['--icon', 'src/main/resources/ch/autumo/ifacex/studio/ui/icons/app-256.png']
            // File associations belong to the installer, not the app-image.
            installerOptions += [
                '--file-associations',
                rootProject.file('product/packaging/file-associations/ifcx.properties').absolutePath,
                '--file-associations',
                rootProject.file('product/packaging/file-associations/ifacex.properties').absolutePath,
                '--resource-dir', 'build/jpackage/ifaceX Studio FX/lib',
                '--license-file', file('package/LICENSE.txt').absolutePath,
                '--linux-menu-group', 'Utility',
                '--linux-shortcut'
            ]
        }

        if (installerType == 'deb') {
            installerOptions += [
                '--linux-deb-maintainer', 'info@autumo.ch'
            ]
        }

        if (installerType == 'rpm') {
            installerOptions += [
                '--linux-rpm-license-type', 'GPLv3'
            ]
        }
    }
}

// ':ui:jpackageImage' consumes the jlink image that ':ui:runtime' produces (build/jre). Gradle 9
// rejects that as an implicit dependency, so declare it explicitly.
// The generated WiX resources must exist as well: 'resourceDir' is a declared input of
// ':jpackageImage' (and of ':jpackage').
tasks.named('jpackageImage') {
    dependsOn tasks.named('runtime')
    dependsOn prepareWixResources
}

def patchDebianDependencies = tasks.register('patchDebianDependencies') {
    def debDir = layout.buildDirectory.dir('jpackage')
    def controlFile = file('package/control')
    def isLinux = System.getProperty('os.name').toLowerCase().contains('linux')
    outputs.upToDateWhen { false }
    onlyIf {
        isLinux && tasks.named('jpackage').get().state.failure == null
    }
    doLast {
        if (!controlFile.isFile()) {
            throw new GradleException("ui/package/control is missing.")
        }
        String depends = controlFile.readLines('UTF-8').find { it.startsWith('Depends:') }
        if (!depends) {
            throw new GradleException("ui/package/control has no 'Depends:' line.")
        }
        List<File> debs = (debDir.get().asFile.listFiles() ?: []).findAll { it.name.endsWith('.deb') }
        debs.each { File deb ->
            File work = new File(temporaryDir, deb.name).tap { deleteDir(); mkdirs() }
            runTool(['dpkg-deb', '-R', deb.absolutePath, work.absolutePath])
            File control = new File(work, 'DEBIAN/control')
            List<String> lines = control.readLines('UTF-8')
            int index = lines.findIndexOf { it.startsWith('Depends:') }
            if (index < 0) {
                lines << depends
            } else if (lines[index] != depends) {
                logger.lifecycle("Replacing build-host dependencies in ${deb.name}")
                logger.lifecycle("  was: ${lines[index]}")
                lines[index] = depends
            }
            control.setText(lines.join('\n') + '\n', 'UTF-8')
            runTool(['dpkg-deb', '--root-owner-group', '-b', work.absolutePath, deb.absolutePath])
        }
    }
}

tasks.named('jpackage') {
    dependsOn prepareWixResources
    finalizedBy patchDebianDependencies
}

void runTool(List<String> command) {
    Process process = new ProcessBuilder(command).redirectErrorStream(true).start()
    String output = process.inputStream.text
    if (process.waitFor() != 0) {
        throw new GradleException("Command failed: ${command.join(' ')}\n${output}")
    }
}
